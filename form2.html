<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        body {
           
            padding: 30px;
           
        }

        h1 {
            text-align: center;
            font-size: 26px;
            font-weight: normal;
            margin-bottom: 30px;
            color: rgb(36, 16, 39);
        }

        form {
            width: 600px;
            margin: 0 auto;
            border: 1px solid #ccc;
            padding: 20px;
            box-shadow: 0 0 10px rgba(26, 26, 26, 0.1);
            background-color: rgb(248, 235, 240);
            border-radius: 3%;
            /* height:700px; */
        }

        .row {
            margin-bottom: 12px;
        }

        label {
            display: inline-block;
            width: 140px;
            text-align: left;
           
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        select,
        textarea {
            width: 280px;
            padding: 4px 6px;
            border: 1px solid #999;
        }

     
        .name input {
            width: 130px;
        }

     
        .dob input {
            width: 60px;
            text-align: center;
        }

      
        .mobile input:first-of-type {
            width: 50px;
            text-align: center;
        }
        .mobile input:last-of-type {
            width: 220px;
        }

        textarea {
            height: 60px;
            resize: vertical;
        }

        .btn {
            text-align: center;
            margin-top: 25px;
        }

        button {
            padding: 6px 25px;
            font-size: 15px;
            cursor: pointer;
            background-color: rgb(187, 185, 183);
            border-radius: 3px;
        }
    </style>
</head>
<body>

    

    <form>
        <h1>Student Registration Form</h1>
        <div class="row">
            <label>Roll no. </label>:
            <input type="text">
        </div>

        <div class="row name">
            <label>Student name </label>:
            <input type="text" placeholder="First Name"> - 
            <input type="text" placeholder="Last Name">
        </div>

        <div class="row">
            <label>Father's name </label>:
            <input type="text">
        </div>

        <div class="row dob">
            <label>Date of birth </label>:
            <input type="text" placeholder="Day"> - 
            <input type="text" placeholder="Month"> - 
            <input type="text" placeholder="Year">
            <span style="margin-left:8px; color:#666;">(DD-MM-YYYY)</span>
        </div>

        <div class="row mobile">
            <label>Mobile no. </label>:
            <input type="text" value="+91"> - 
            <input type="text">
        </div>

        <div class="row">
            <label>Email id </label>:
            <input type="email">
        </div>

        <div class="row">
            <label>Password </label>:
            <input type="password">
        </div>

        <div class="row">
            <label>Gender </label>:
            <input type="radio" name="gender" value="Male"> Male
            <input type="radio" name="gender" value="Female"> Female
        </div>

        <div class="row">
            <label>Department </label>:
            <input type="checkbox" name="dept" value="CSE"> CSE
            <input type="checkbox" name="dept" value="IT"> IT
            <input type="checkbox" name="dept" value="ECE"> ECE
            <input type="checkbox" name="dept" value="Civil"> Civil
            <input type="checkbox" name="dept" value="Mech"> Mech
        </div>

        <div class="row">
            <label>Course </label>:
            <select>
                <option value="" disabled selected>--------- Select Current Course's ---------</option>
                <option value="CSE">Computer Science and Engineering</option>
                <option value="ECE">Electronics and Communication Engineering</option>
                <option value="ME">Mechanical Engineering</option>
                <option value="CE">Civil Engineering</option>
                <option value="EE">Electrical Engineering</option>
            </select>
        </div>

        <div class="row">
            <label>Student photo </label>:
            <input type="file">
        </div>

        <div class="row">
            <label>City </label>:
            <input type="text">
        </div>

        <div class="row">
            <label>Address </label>:
            <textarea></textarea>
        </div>
     <br>
     <br>

        <div class="btn">
            <button type="submit">Register</button>
        </div>
    </form>

</body>
</html>
